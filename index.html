<!doctype html>
<!--
  檔案功能：配色標本室（Color Atlas）單一全視窗畫布主頁面，包含右側巨幅出血 3D 色環與左側海報垂直構成軸線。
  相依性：載入 style.css、mixer.css、exhibition.css、desk.css、motion-studio.css 與 mixer.js（ES Module）。
-->
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#ECECEE" />
    <title>配色標本室｜專案配色</title>
    <meta
      name="description"
      content="點選立體色環，依主色探索搭配色，將色碼與面積比例整段複製給 AI。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_TW" />
    <meta property="og:site_name" content="Color Atlas 配色標本室" />
    <meta property="og:title" content="Color Atlas 配色標本室" />
    <meta property="og:description" content="從立體色環挑選主色、試搭底色，一鍵把色碼與比例複製給 AI。" />
    <meta property="og:url" content="https://gwolf0719.github.io/site-color-atlas/" />
    <meta property="og:image" content="https://gwolf0719.github.io/site-color-atlas/docs/images/color-atlas-cover.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1600" />
    <meta property="og:image:height" content="800" />
    <meta property="og:image:alt" content="配色標本室的彩色摺紙色環，旁邊寫著「選好配色，一鍵複製給 AI」。" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Color Atlas 配色標本室" />
    <meta name="twitter:description" content="從立體色環挑選主色、試搭底色，一鍵把色碼與比例複製給 AI。" />
    <meta name="twitter:image" content="https://gwolf0719.github.io/site-color-atlas/docs/images/color-atlas-cover.jpg" />
    <meta name="twitter:image:alt" content="配色標本室的彩色摺紙色環，旁邊寫著「選好配色，一鍵複製給 AI」。" />
    <link rel="stylesheet" href="style.css?v=studio-5" />
    <link rel="stylesheet" href="mixer.css?v=studio-5" />
    <link rel="stylesheet" href="exhibition.css?v=studio-5" />
    <link rel="stylesheet" href="desk.css?v=studio-5" />
    <link rel="stylesheet" href="motion-studio.css?v=studio-5" />
    <script type="importmap">
      {
        "imports": {
          "./motion-studio.mjs": "./motion-studio.mjs?v=studio-5",
          "./paper-interactions.mjs": "./paper-interactions.mjs?v=studio-5",
          "./live-proof.mjs": "./live-proof.mjs?v=studio-5",
          "./commercial-color.mjs": "./commercial-color.mjs?v=studio-5",

          "./mixer.js": "./mixer.js?v=studio-5",
          "./mixer-data.mjs": "./mixer-data.mjs?v=studio-5",
          "./spectrum.mjs": "./spectrum.mjs?v=studio-5",
          "./color-rules.mjs": "./color-rules.mjs?v=studio-5",
          "./hunt.js": "./hunt.js?v=studio-5",
          "./ring.js": "./ring.js?v=studio-5",
          "./chromatic-scene.js": "./chromatic-scene.js?v=studio-5",
          "./vendor/three.js": "./vendor/three.js?v=studio-5"
        }
      }
    </script>
    <script type="module" src="mixer.js?v=studio-5"></script>
  </head>
  <body>
    <header class="studio-header">
      <div class="head">
        <a class="brand" href="./"
          ><i class="mark" aria-hidden="true"></i
          ><span lang="en">COLOR ATLAS</span><small>配色標本室</small></a
        >
        <ol id="progress-steps" class="progress-steps" aria-label="配色步驟">
          <li data-step="主色"><span>01</span>主色</li>
          <li data-step="背景"><span>02</span>底色</li>
          <li data-step="輔助色"><span>03</span>輔助</li>
          <li data-step="就緒"><span>04</span>完稿</li>
        </ol>
        <nav aria-label="主導覽">
          <button id="reset" class="reset-desk" aria-label="重設轉盤">
            重設
          </button>
        </nav>
      </div>
      <div class="header-progress-line" aria-hidden="true"><i id="progress-bar-fill"></i></div>
    </header>
    <main class="atelier-main">
      <section id="mixer" aria-labelledby="mix-title">
        <div class="stage">
          <div class="stage-main">
            <div class="stage-intro">
              <div class="intro-head">
                <span class="edition-kicker" lang="en">SPECIMEN / CHROMATIC DIRECTION</span>
                <h1 id="mix-title">
                  <span id="pick-verb">選</span><em id="hub-role">主色</em>
                </h1>
                <p id="instruction"></p>
              </div>
              <div class="plate-bar">
                <span id="wheel-kind" class="kind-pill">色環</span>
                <button
                  id="study-toggle"
                  class="seg-toggle"
                  aria-expanded="false"
                  aria-controls="color-study"
                >
                  並置比較
                </button>
              </div>
            </div>

            <div class="print-plate">
              <div id="wheel-host" aria-hidden="true"></div>
              <div class="orbit" id="orbit">
                <div id="ring-fallback" aria-hidden="true"></div>
              </div>
              <figure id="color-study" hidden>
                <div class="study-fields">
                  <div><i></i><code></code></div>
                  <div><i></i><code></code></div>
                </div>
                <figcaption>
                  兩個中央色塊使用同一色碼 <code id="study-ink"></code>
                </figcaption>
              </figure>
              <div class="plate-readout">
                <span id="readout-label">拖曳旋轉 · 點選取色</span>
                <span class="readout-codes">
                  <code id="readout-hex"></code>
                  <code id="hover-code"></code>
                </span>
              </div>
            </div>

            <div class="choice-area">
              <div class="choice-head">
                <span class="choice-title">推薦色票</span>
                <div class="mix-browse">
                  <button id="more-colors" hidden>下一批推薦</button>
                  <button id="switch-colors" hidden>瀏覽全色環</button>
                </div>
              </div>
              <div id="recommendations" aria-label="推薦配色"></div>

              <div id="tones" class="tone-controls" hidden>
                <div class="tone-group">
                  <span class="tone-label">明度</span>
                  <div class="tone-pills" data-sync="lightness" role="group" aria-label="明度快選"></div>
                  <select id="lightness" aria-label="明度">
                    <option value="18">極深</option>
                    <option value="29">深色</option>
                    <option value="40">中深</option>
                    <option value="50" selected>中等</option>
                    <option value="62">明亮</option>
                    <option value="74">淺色</option>
                  </select>
                </div>
                <div class="tone-group">
                  <span class="tone-label">彩度</span>
                  <div class="tone-pills" data-sync="saturation" role="group" aria-label="彩度快選"></div>
                  <select id="saturation" aria-label="彩度">
                    <option value="16">灰調</option>
                    <option value="30">柔和</option>
                    <option value="44" selected>標準</option>
                    <option value="58">濃郁</option>
                  </select>
                </div>
              </div>

              <details id="custom-tools">
                <summary>指定色碼、底色灰階與精準調色</summary>
                <div class="custom-tools-body">
                  <div id="brand-color" class="tool-block">
                    <form id="hex-form">
                      <label for="custom-hex">指定色碼</label>
                      <div class="hex-input-wrap">
                        <i id="hex-dot" class="hex-dot" aria-hidden="true"></i>
                        <input
                          id="custom-hex"
                          placeholder="#4659A8"
                          maxlength="7"
                          autocomplete="off"
                          spellcheck="false"
                        />
                      </div>
                      <button type="submit">加入</button>
                    </form>
                    <small id="hex-feedback" role="status"></small>
                  </div>

                  <div id="background-options" class="tool-block">
                    <div class="background-settings">
                      <div class="background-line">
                        <label for="gray-action">灰階快選</label>
                        <select id="gray-action">
                          <option value="background">設為底色</option>
                          <option value="palette">加入配色</option>
                        </select>
                        <output id="current-bg">底色未指定</output>
                      </div>
                      <div
                        id="gray-swatches"
                        role="group"
                        aria-label="黑白灰色階"
                      ></div>
                      <div class="custom-bg-row">
                        <label class="custom-background"
                          >自訂底色
                          <input id="custom-bg" type="color" value="#ECECEE"
                        /></label>
                        <span id="bg-feedback" role="status"></span>
                      </div>
                    </div>
                  </div>

                  <div id="precision" class="tool-block">
                    <div class="precision-inside">
                      <label for="color-choice" id="choice-label">色環選項快速試放</label>
                      <div class="choose">
                        <select id="color-choice"></select>
                        <button id="compare" aria-pressed="false">試放此色</button>
                        <button id="add-color">加入配色</button>
                      </div>
                    </div>
                  </div>
                </div>
              </details>
            </div>
          </div>

          <aside class="stage-inspector" aria-label="專案色票與調色面板">
            <div class="stage-foot">
              <div class="sample-proof">
                <div class="proof-head">
                  <h2>專案色票</h2>
                  <span id="proof-state" role="status"></span>
                </div>
                <div
                  id="proof-strip"
                  role="group"
                  aria-label="已選色帶，點選可移除"
                ></div>
                <div id="palette-values" aria-label="專案色碼及面積"></div>
                <div class="desk-actions">
                  <button
                    id="open-recipe"
                    aria-controls="recipe-sheet"
                    aria-expanded="false"
                  >
                    調整配色
                  </button>
                  <button id="quick-copy" disabled>複製給 AI</button>
                  <small id="desk-feedback" role="status"></small>
                </div>
              </div>
            </div>

            <section
              hidden
              id="recipe-sheet"
              class="desk-sheet"
              aria-labelledby="recipe-title"
            >
              <div class="sheet-head">
                <h2 id="recipe-title">比例與角色配置</h2>
                <div class="sheet-buttons">
                  <button id="undo" disabled>移除末色</button>
                  <button data-close class="sheet-close">收合</button>
                </div>
              </div>
              <div class="mix-output" id="configuration">
                <div class="ratio-sheet">
                  <div id="proportion" aria-label="顏色面積比例"></div>
                  <div id="seams"></div>
                </div>
                <div id="allocations"></div>
                <div id="role-preview" hidden>
                  <div class="contrast-bar">
                    <span id="wcag-badge" class="wcag-badge"></span>
                    <p id="role-contrast"></p>
                  </div>
                  <div id="ui-sample-card" class="ui-sample-card" aria-hidden="true">
                    <div class="poster-meta">
                      <span lang="en">LIVE PROOF</span>
                      <span class="poster-dot"></span>
                    </div>
                    <div class="ui-sample-copy">
                      <strong>色彩張力與版面層次</strong>
                      <span>主視覺標題、內文與重點色塊的實境印刷試樣</span>
                    </div>
                    <div class="poster-foot">
                      <span class="poster-bar"></span>
                      <span class="ui-sample-btn">主色焦點</span>
                    </div>
                  </div>
                </div>
                <details id="advanced-output">
                  <summary>網站用途與微調</summary>
                  <div class="business-proof">
                    <div class="use-row">
                      <label for="business-use">網站用途</label>
                      <select id="business-use">
                        <option value="general">通用</option>
                        <option value="brand">品牌官網</option>
                        <option value="shop">商品導購</option>
                        <option value="system">資訊系統</option>
                      </select>
                    </div>
                    <div id="chroma-tools" hidden>
                      <button id="try-chroma" aria-pressed="false">試看較低彩度</button>
                      <button id="apply-chroma" hidden>採用試放主色</button>
                    </div>
                    <p id="business-note"></p>
                  </div>
                  <div id="pair-tools" hidden>
                    <label
                      >移動交界
                      <select id="pair-choice"></select></label>
                    <div class="pair-steppers">
                      <button id="pair-minus" aria-label="左色減少百分之一">−1%</button>
                      <button id="pair-plus" aria-label="左色增加百分之一">+1%</button>
                    </div>
                  </div>
                </details>
                <p id="mix-empty">
                  點選色環加入第一個顏色，右側將即時顯示色碼、比例與無障礙對比檢核。
                </p>
                <div class="send-row">
                  <div class="actions">
                    <button id="copy-mix" disabled>複製整段給 AI</button>
                    <button id="share-mix" disabled>複製配色連結</button>
                  </div>
                  <span id="mix-feedback" role="status"></span>
                </div>
              </div>
            </section>
          </aside>
        </div>
      </section>
    </main>
    <noscript>請啟用 JavaScript 使用互動色環。</noscript>
  </body>
</html>
